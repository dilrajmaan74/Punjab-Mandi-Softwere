    <script>
      // Global error shield to prevent harmless iframe / dev-server noise from crashing the UI
      window.addEventListener('error', function (event) {
        if (!event.error && event.message === 'Script error.') {
          event.preventDefault();
          return true;
        }
        if (event.message && (
          event.message.indexOf('WebSocket') !== -1 ||
          event.message.indexOf('ResizeObserver') !== -1 ||
          event.message.indexOf('virtual:pwa') !== -1
        )) {
          event.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = '' + (event.reason || '');
        if (
          reason.indexOf('WebSocket') !== -1 ||
          reason.indexOf('service worker') !== -1 ||
          reason.indexOf('ServiceWorker') !== -1
        ) {
          event.preventDefault();
          return true;
        }
      });
    </script>
